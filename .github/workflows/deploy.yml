name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # <user>.github.io serves from the domain root; any other repo serves from /<repo>.
      - name: Set base path
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"; else echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"; fi
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""
      # The old project-site address (/Brand-C) only redirects to the same page on the root site.
      - name: Turn old address into redirects
        if: ${{ !endsWith(github.event.repository.name, '.github.io') }}
        run: node scripts/redirect-site.mjs out "https://charan-venkatesh.github.io" "$NEXT_PUBLIC_BASE_PATH"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.deployment_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
